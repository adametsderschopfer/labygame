# Uncrustify 0.83.0 inserts structural blank lines; clang-format runs afterward.
# Rules are syntactic, not semantic: consecutive calls remain grouped together.
nl_before_if = add
nl_after_if = add
nl_before_for = add
nl_after_for = add
nl_before_while = add
nl_after_while = add
nl_before_switch = add
nl_after_switch = add
nl_before_do = add
nl_after_do = add
nl_before_return = true
nl_after_return = true
nl_var_def_blk_start = 1
nl_var_def_blk_end = 1
nl_var_def_blk_end_func_top = 1
nl_max = 2
nl_after_func_body = 2
eat_blanks_after_open_brace = true
eat_blanks_before_close_brace = true

# Do not rewrite tokens, comments or include order.
mod_sort_include = false
mod_sort_using = false
mod_remove_extra_semicolon = false
mod_full_brace_if = ignore
mod_full_brace_for = ignore
mod_full_brace_while = ignore
mod_full_brace_do = ignore
nl_define_macro = false
